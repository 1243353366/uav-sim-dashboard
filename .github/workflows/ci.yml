name: Validate deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wrangler deploy dry-run
        run: npx -y wrangler@4 deploy --dry-run
